<!DOCTYPE html>
<html>
    <head>
        <title>FLLEXBOX</title>

        <style>
            
        </style>
    </head>
    <body style="padding-bottom: 1000px;">
        <div style="
            display: flex;
            flex-direction:row;">
            <div style="background-color: blueviolet;">div 1 text </div>
            <div style="background-color: cyan;">div 2 <p>text</p></div>
        </div>




        <div style="
            display: flex;
            flex-direction:row;
            margin-top: 30px;
            ">
            <div style="background-color: blueviolet; width: 100px;">100px </div>
            <div style="background-color: cyan; flex: 1 ;">flex: 1</div>
        </div>




         <div style="
            display: flex;
            flex-direction:row;
            margin-top: 30px;
            ">
            <div style="background-color: blueviolet; width: 100px;">100px </div>
            <div style="background-color: cyan; flex: 1 ;">flex: 1</div>
            <div style="background-color:blueviolet; flex: 1 ;">flex: 2</div>
        </div>

<div style="
            display: flex;
            flex-direction:row;
            margin-top: 30px;
            height: 70px;
            justify-content: center;
            border-radius: 2px;
            border-width: 2px;
            border-color: black;
            border-style: solid;
            ">
            <div style="background-color: blueviolet; width: 100px;">100px </div>
            <div style="background-color: cyan; width:100px ;">100px</div>
            <div style="background-color:blueviolet; width:100px ;">flex: 2</div>
        </div>


<div style="
            display: flex;
            flex-direction:row;
            margin-top: 30px;
            height: 70px;
            justify-content: space-between;
            border-radius: 2px;
            border-width: 2px;
            border-color: black;
            border-style: solid;
            ">
            <div style="background-color: blueviolet; width: 100px;">100px </div>
            <div style="background-color: cyan; width:100px ;">100px</div>
            <div style="background-color:blueviolet; width:100px ;">flex: 2</div>
        </div>


<div style="
            display: flex;
            flex-direction:row;
            margin-top: 30px;
            height: 70px;
            justify-content: space-between;
            align-items: center;
            
            border-radius: 2px;
            border-width: 2px;
            border-color: black;
            border-style: solid;
            ">
            <div style="background-color: blueviolet; width: 100px;">100px </div>
            <div style="background-color: cyan; width:100px ;">100px</div>
            <div style="background-color:blueviolet; width:100px ;">flex: 2</div>
        </div>
        
    </body>
    </html>
